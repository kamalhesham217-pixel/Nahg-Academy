<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تسجيل الدخول | أكاديمية نهج</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <header class="auth-head">
      <h1>تسجيل الدخول</h1>
      <p>مرحباً بعودتك إلى أكاديمية نهج</p>
    </header>

    <form class="auth-form" id="loginForm">
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" dir="ltr" required />
      </div>
      <div class="field">
        <label for="password">كلمة المرور</label>
        <input id="password" type="password" dir="ltr" required />
      </div>

      <div id="msg" class="msg"></div>
      <button class="submit-btn" id="submitBtn" type="submit">دخول</button>
    </form>

    <p class="auth-links">ليس لديك حساب؟ <a href="register.html">إنشاء حساب جديد</a></p>
  </main>

  <script type="module" src="login.js"></script>
</body>
</html>
