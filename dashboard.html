<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>لوحتي | أكاديمية نهج</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <header class="auth-head">
      <h1 id="welcome">...</h1>
      <p id="role"></p>
    </header>
    <div class="auth-form">
      <button class="submit-btn" id="logoutBtn">تسجيل الخروج</button>
    </div>
  </main>

  <script type="module">
    import { supabase } from "./supabase.js";

    const { data: { session } } = await supabase.auth.getSession();
    if (!session) {
      window.location.href = "login.html";
    } else {
      const { data: profile } = await supabase
        .from("profiles").select("full_name, role").eq("id", session.user.id).single();

      const roles = { student: "طالب", teacher: "محفظ", admin: "مشرف" };
      document.getElementById("welcome").textContent = "أهلاً " + (profile?.full_name || "");
      document.getElementById("role").textContent = roles[profile?.role] || "";
    }

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      await supabase.auth.signOut();
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
