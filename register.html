<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>إنشاء حساب | أكاديمية نهج</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <header class="auth-head">
      <h1>إنشاء حساب جديد</h1>
      <p>انضم إلى أسرة أكاديمية نهج</p>
    </header>

    <form class="auth-form" id="registerForm">
      <div class="field">
        <label for="fullName">الاسم الكامل</label>
        <input id="fullName" type="text" required />
      </div>
      <div class="field">
        <label for="phone">رقم الموبايل</label>
        <input id="phone" type="tel" dir="ltr" />
      </div>
      <div class="field">
        <label for="email">البريد الإلكتروني</label>
        <input id="email" type="email" dir="ltr" required />
      </div>
      <div class="field">
        <label for="password">كلمة المرور (6 أحرف على الأقل)</label>
        <input id="password" type="password" dir="ltr" minlength="6" required />
      </div>

      <div id="msg" class="msg"></div>
      <button class="submit-btn" id="submitBtn" type="submit">إنشاء الحساب</button>
    </form>

    <p class="auth-links">لديك حساب؟ <a href="login.html">تسجيل الدخول</a></p>
  </main>

  <script type="module" src="register.js"></script>
</body>
</html>
